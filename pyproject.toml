[project]
name = "willay"
version = "0.1.0"
description = "Agent-written TOML dialogue, voices, sound effects and private podcasts"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [
    { name = "Steve Brown", email = "scbrown3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
willay = "willay.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
