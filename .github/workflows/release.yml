name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag whose release artifacts should be rebuilt
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run required CI on the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          test "$(jq 'length' <<< "$RELEASE_PRS")" -gt 0
          while IFS= read -r branch; do
            gh workflow run check.yml --ref "$branch"
            gh workflow run bootstrap.yml --ref "$branch"
          done < <(jq -er '.[].headBranchName' <<< "$RELEASE_PRS")
  artifacts:
    needs: release-please
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Resolve independently requested tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$CREATED_TAG"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git checkout --detach "refs/tags/$TAG"
          ACTUAL="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$ACTUAL" = "${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Package and checksum the tagged artifacts
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print)"
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload to the exact release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
