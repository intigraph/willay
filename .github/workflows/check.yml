name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ty check src
      - run: uv build --wheel
